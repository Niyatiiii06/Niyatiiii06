name: Generate Snake Animation

on:
  schedule:
    # Runs every day at 00:00 UTC so the grid never goes stale
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Prevent overlapping runs from racing each other onto the output branch
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    # REQUIRED: without this the push to the `output` branch fails with 403.
    # Repos created after Feb 2023 default GITHUB_TOKEN to read-only.
    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ Niyatiiii06 }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6
            dist/github-contribution-grid-snake.gif?color_snake=#8B5CF6&color_dots=#161B22,#4C1D95,#6D28D9,#8B5CF6,#A78BFA

      - name: Push snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
